{{ define "main" }}
  <h1 class="visually-hidden">{{ .Title }}</h1>
  <p class="contact-intro">{{ .Params.intro }}</p>
  <div class="contact">
    <form name="contact" method="POST" action="{{ "thanks/" | relURL }}" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact">
      <p class="hp"><label>Leave this empty <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
      <fieldset class="name">
        <legend>Name</legend>
        <label>First Name <span>(required)</span><input type="text" name="first-name" autocomplete="given-name" required></label>
        <label>Last Name <span>(required)</span><input type="text" name="last-name" autocomplete="family-name" required></label>
      </fieldset>
      <label>Email Address <span>(required)</span><input type="email" name="email" autocomplete="email" required></label>
      <label>Subject <span>(required)</span><input type="text" name="subject" required></label>
      <label>Message <span>(required)</span><textarea name="message" rows="4" required></textarea></label>
      <button type="submit">Submit</button>
    </form>
    <address>
      <strong>{{ .Params.name }}</strong>
      {{ with .Params.email }}<a href="mailto:{{ . }}">{{ . }}</a>{{ end }}
      {{ with .Params.phone }}<a href="tel:{{ replaceRE `[^+\d]` "" . }}">{{ . }}</a>{{ end }}
    </address>
  </div>
  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
{{ end }}
